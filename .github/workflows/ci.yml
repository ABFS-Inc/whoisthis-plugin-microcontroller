name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the esp32 core and optional libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit SSD1306" "Adafruit GFX Library"
      - name: Compile (default config)
        run: arduino-cli compile --warnings default --fqbn esp32:esp32:XIAO_ESP32S3:PSRAM=opi --export-binaries firmware/whoisthis_xiao_sense
      - name: Compile (every option on)
        run: >
          arduino-cli compile --warnings default --fqbn esp32:esp32:XIAO_ESP32S3:PSRAM=opi firmware/whoisthis_xiao_sense
          --build-property "compiler.cpp.extra_flags=-DWIT_OLED=1 -DWIT_BATTERY_PIN=1 -DWIT_BUZZER_PIN=3"
      - name: Compile (capture-on-tap fob)
        run: >
          arduino-cli compile --warnings default --fqbn esp32:esp32:XIAO_ESP32S3:PSRAM=opi firmware/whoisthis_xiao_sense
          --build-property "compiler.cpp.extra_flags=-DWIT_CAPTURE_ON_TAP=1 -DWIT_BATTERY_PIN=1 -DWIT_BUZZER_PIN=3"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/whoisthis_xiao_sense/build/**/*.bin
