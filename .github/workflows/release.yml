# Every merge to main ships a signed plugin APK: GitHub Release + whoisthis.online/download/plugins/microcontroller/.
name: release

on:
  push:
    branches: [main]
    paths: [app/**, firmware/**, gradle.properties, .github/workflows/release.yml]

permissions:
  contents: write

concurrency: { group: release, cancel-in-progress: false }

env:
  PLUGIN: microcontroller
  R2_BUCKET: whoisthis-releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4

      - id: v
        run: |
          base=$(sed -n 's/^pluginVersion=//p' gradle.properties | cut -d. -f1,2)
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set on this repository; release signing needs ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/plugin.jks"
          cat > key.properties <<EOF2
          storeFile=$RUNNER_TEMP/plugin.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOF2

      - run: >
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
          -PpluginVersion=${{ steps.v.outputs.name }} -PpluginVersionCode=${{ steps.v.outputs.code }}

      - id: apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/whoisthis-plugin-$PLUGIN-v${{ steps.v.outputs.name }}.apk"
          cd out
          apk=$(ls *.apk)
          sha256sum "$apk" > SHA256SUMS
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          signer=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: //p' | head -1)
          test -n "$signer"
          contract=$(sed -n 's/.*capture-contract:\([0-9]*\).*/\1/p' ../app/build.gradle.kts | head -1)
          printf '{"plugin":"%s","package":"online.whoisthis.plugin.microcontroller","version":"%s","build":%s,"contract":%s,"signer_sha256":"%s","apk":"https://whoisthis.online/download/plugins/%s/%s","sha256":"%s","size":%s,"published_at":"%s","release":"https://github.com/${{ github.repository }}/releases/tag/v%s"}\n' \
            "$PLUGIN" "${{ steps.v.outputs.name }}" "${{ steps.v.outputs.code }}" "${contract:-1}" "$signer" "$PLUGIN" "$apk" \
            "$(cut -d' ' -f1 SHA256SUMS)" "$(stat -c%s "$apk")" "$(date -u +%FT%TZ)" "${{ steps.v.outputs.name }}" > latest.json
          cat latest.json
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - uses: arduino/setup-arduino-cli@v2
      - name: Build firmware
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit SSD1306" "Adafruit GFX Library"
          arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32S3:PSRAM=opi --export-binaries firmware/whoisthis_xiao_sense
          cp firmware/whoisthis_xiao_sense/build/esp32.esp32.XIAO_ESP32S3/whoisthis_xiao_sense.ino.merged.bin "out/whoisthis-firmware-xiao-esp32s3-sense-v${{ steps.v.outputs.name }}.bin"
          # Point-and-ask fob: capture on a press only (docs/blueprints/point-and-ask-fob/config.h), battery divider on A0, buzzer on D2.
          arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32S3:PSRAM=opi --build-path build-fob firmware/whoisthis_xiao_sense \
            --build-property "compiler.cpp.extra_flags=-DWIT_CAPTURE_ON_TAP=1 -DWIT_BATTERY_PIN=1 -DWIT_BUZZER_PIN=3"
          cp build-fob/whoisthis_xiao_sense.ino.merged.bin "out/whoisthis-firmware-xiao-esp32s3-sense-fob-v${{ steps.v.outputs.name }}.bin"
          (cd out && sha256sum *.bin >> SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: ${{ env.PLUGIN }} v${{ steps.v.outputs.name }}
          files: |
            out/*.apk
            out/*.bin
            out/SHA256SUMS
            out/latest.json

      - name: Publish to whoisthis.online/download/plugins
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd out
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/plugins/$PLUGIN/${{ steps.apk.outputs.apk }}" --file "${{ steps.apk.outputs.apk }}" --content-type application/vnd.android.package-archive --remote
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/plugins/$PLUGIN/SHA256SUMS" --file SHA256SUMS --content-type text/plain --remote
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/plugins/$PLUGIN/latest.json" --file latest.json --content-type application/json --remote
